<script>
  (function() {
    // 수동으로 끄면 현재 페이지 유지
    if (localStorage.getItem('lang_selected') === 'true') return;

    // 브라우저 언어 확인
    var userLang = navigator.language || navigator.userLanguage;
    var isJaBrowser = userLang.toLowerCase().indexOf('ja') !== -1;
    var isJaPage = window.location.pathname.startsWith('/ja/');

    // 리다이렉트 처리
    if (isJaBrowser && !isJaPage) {
      // 내 언어가 일본어인데 한국어 페이지에 있다면 -> 일본어로 보냄
      window.location.href = '/ja' + window.location.pathname;
    } 
    else if (!isJaBrowser && isJaPage) {
      // 내 언어가 한국어인데 일본어 페이지에 있다면 -> 한국어로 보냄
      var newPath = window.location.pathname.replace(/^\/ja/, '');
      if (newPath === '') newPath = '/'; // 주소가 완전히 비어버리면 메인으로
      window.location.href = newPath;
    }
  })();
</script>
